[package]
name = "zicode-studio-shell"
version = "0.4.2"
edition = "2021"
description = "Bounded Windows Explorer selection bridge for ZiCode Studio Desktop"

[lib]
crate-type = ["cdylib"]

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
] }
windows-core = "=0.62.2"
