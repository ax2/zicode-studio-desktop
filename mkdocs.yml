site_name: Pi Windows Desktop
site_description: Product, architecture, packaging, and delivery documentation for Pi Windows Desktop.
repo_url: https://github.com/ax2/pi-windows-desktop
repo_name: ax2/pi-windows-desktop
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

nav:
  - 首页: index.md
  - 产品需求: requirements.md
  - 架构方案: architecture.md
  - 场景与实例隔离: scenes-and-isolation.md
  - Windows 打包: windows-packaging.md
  - 实施计划: implementation-plan.md
  - 实现状态: implementation-status.md
  - 方案 Review: reviews/2026-07-30-solution-review.md
  - ADR:
      - 单一 Rust Host 与 Pi RPC: adr/0001-single-host-native-pi-rpc.md
      - Runtime 身份与生命周期: adr/0002-runtime-identity-and-lifecycle.md
      - 数据所有权与远程安全: adr/0003-data-ownership-and-remote-security.md
      - 场景与实例隔离: adr/0004-scene-and-instance-isolation.md
  - 开发资料:
      - 设计规范: DESIGN.md
      - 自动更新: AUTO_UPDATER.md
      - 模块拆分: MODULE_SPLIT_PLAN.md
