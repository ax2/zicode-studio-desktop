site_name: ZiCode Studio Desktop
site_description: Product, architecture, packaging, and delivery documentation for ZiCode Studio Desktop.
repo_url: https://github.com/ax2/zicode-studio-desktop
repo_name: ax2/zicode-studio-desktop
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - zh
        - en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

