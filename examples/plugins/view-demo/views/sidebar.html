<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: light dark;
        font: 13px/1.5 system-ui, sans-serif;
      }

      body {
        margin: 0;
        padding: 12px;
        color: CanvasText;
        background: Canvas;
      }

      button {
        width: 100%;
        min-height: 34px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 7px;
        color: inherit;
        background: color-mix(in srgb, CanvasText 6%, Canvas);
        cursor: pointer;
      }

      output {
        display: block;
        margin-top: 10px;
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <button id="context" type="button">Read Host context</button>
    <output id="result">Waiting for the isolated View SDK.</output>
    <script>
      const output = document.getElementById("result");
      document.getElementById("context").addEventListener("click", async () => {
        const context = await window.zicode.context.get();
        output.textContent = `${context.sceneId} · ${context.locale} · API ${context.apiVersion}`;
      });
    </script>
  </body>
</html>
