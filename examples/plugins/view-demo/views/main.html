<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      :root {
        color-scheme: light dark;
        font: 15px/1.6 system-ui, sans-serif;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: start center;
        color: CanvasText;
        background: Canvas;
      }

      main {
        width: min(720px, calc(100% - 48px));
        margin-top: 48px;
      }

      .card {
        padding: 24px;
        border: 1px solid color-mix(in srgb, CanvasText 16%, transparent);
        border-radius: 14px;
        background: color-mix(in srgb, CanvasText 4%, Canvas);
      }

      textarea {
        width: 100%;
        min-height: 140px;
        box-sizing: border-box;
        padding: 12px;
        border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
        border-radius: 8px;
        color: inherit;
        background: Canvas;
        font: inherit;
        resize: vertical;
      }

      button {
        min-height: 36px;
        margin-top: 12px;
        padding: 0 14px;
        border: 0;
        border-radius: 8px;
        color: white;
        background: #0f766e;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Isolated Developer View</h1>
        <p>
          This HTML runs in an opaque sandbox. It cannot read the ZiCode shell DOM or call the
          network directly.
        </p>
        <textarea id="draft" aria-label="Draft">Edit this text to test canDeactivate.</textarea>
        <button id="notify" type="button">Send a Host notification</button>
        <button id="worker" type="button">Call isolated Worker</button>
        <output id="result" aria-live="polite"></output>
      </section>
    </main>
    <script>
      const draft = document.getElementById("draft");
      draft.addEventListener("input", () => window.zicode.setDirty(true));
      document.getElementById("notify").addEventListener("click", async () => {
        const context = await window.zicode.ready();
        await window.zicode.ui.showInformation(
          `View ${context.viewId} is isolated in scene ${context.sceneId}.`,
        );
      });
      document.getElementById("worker").addEventListener("click", async () => {
        const result = await window.zicode.capabilities.invoke("example.echo", {
          text: draft.value,
        });
        document.getElementById("result").textContent =
          `${result.text} · ${result.sceneId} · process ${result.runtime}`;
      });
    </script>
  </body>
</html>
