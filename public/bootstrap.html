<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZiCode Studio Desktop Startup</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101113;
      color: #e7e8ea;
      display: grid;
      place-items: center;
      min-height: 100vh;
    }
    .card {
      width: min(680px, calc(100vw - 48px));
      border: 1px solid #2b2e33;
      border-radius: 14px;
      background: #16181c;
      padding: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.32);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { margin: 0 0 12px; color: #b7bdc8; line-height: 1.45; }
    .error {
      margin: 10px 0 16px;
      border-radius: 10px;
      border: 1px solid #3b2225;
      background: #231417;
      color: #ffb4bd;
      padding: 10px 12px;
      font-size: 12px;
      white-space: pre-wrap;
      display: none;
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      border: 1px solid #2f3744;
      background: #1e2633;
      color: #dce6f8;
      border-radius: 9px;
      padding: 9px 14px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.7;
      cursor: wait;
    }
    .hint {
      margin-top: 10px;
      min-height: 18px;
      font-size: 12px;
      color: #8f98a8;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1 id="startup-title">ZiCode Studio Desktop could not start</h1>
    <p id="startup-body-1">The embedded <code>pi</code> runtime that ships with ZiCode Studio Desktop failed to launch.</p>
    <p id="startup-body-2">This usually means the installation is incomplete or corrupted. Reinstalling ZiCode Studio Desktop normally fixes it. Click <b id="retry-label">Retry startup</b> after reinstalling or rebooting.</p>
    <div id="startup-error" class="error"></div>
    <div class="actions">
      <button id="retry-btn" type="button" data-retry>Retry startup</button>
    </div>
    <div id="hint" class="hint"></div>
  </main>
  <script>
    const localeCookie = document.cookie
      .split("; ")
      .find((value) => value.startsWith("zicode-studio-locale="));
    const cookieLocale = localeCookie
      ? decodeURIComponent(localeCookie.slice("zicode-studio-locale=".length))
      : "";
    const zh = (cookieLocale || navigator.language || "").toLowerCase().startsWith("zh");
    if (zh) {
      const texts = {
        title: "ZiCode Studio Desktop 无法启动",
        body1: "随 ZiCode Studio Desktop 内置的 pi 运行时启动失败。",
        body2: "这通常意味着安装不完整或已损坏。重新安装 ZiCode Studio Desktop 一般可以修复；重新安装或重启后，点击“重试启动”。",
        retry: "重试启动",
      };
      document.title = texts.title;
      document.getElementById("startup-title").textContent = texts.title;
      document.getElementById("startup-body-1").textContent = texts.body1;
      document.getElementById("startup-body-2").innerHTML = texts.body2.replace("“重试启动”", `<b>${texts.retry}</b>`);
      document.getElementById("retry-btn").textContent = texts.retry;
      document.documentElement.lang = "zh-CN";
    }
    const retryBtn = document.getElementById('retry-btn');
    const hint = document.getElementById('hint');
    const errorBox = document.getElementById('startup-error');
    const rawError = new URLSearchParams(window.location.search).get('startupError');
    if (rawError) {
      errorBox.style.display = 'block';
      errorBox.textContent = decodeURIComponent(rawError);
    }

    retryBtn.addEventListener('click', async () => {
      retryBtn.disabled = true;
      hint.textContent = 'Restart ZiCode Studio Desktop to retry startup.';
    });
  </script>
</body>
</html>
