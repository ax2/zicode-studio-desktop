<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <base href="/" />
        <title>ZiCode Studio Desktop</title>
        <link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
        <link rel="apple-touch-icon" href="icons/app-192.png" />
        <link rel="manifest" href="manifest.json" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="ZiCode Studio" />
        <meta name="theme-color" content="#ffffff" />
        <link rel="stylesheet" href="style-theme.css" />
        <link rel="stylesheet" href="design-system.css" />
        <link rel="stylesheet" href="style.bundle.css" />
        <script src="/vendor/chart.umd.js"></script>
                <script type="importmap">
                    {
                        "imports": {
                            "i18n": "/i18n.js",
                            "themes": "/themes.js",
                            "react": "/native/react/vendor.js",
                            "react-dom": "/native/react/vendor.js",
                    "react-dom/client": "/native/react/vendor.js",
                    "react/jsx-runtime": "/native/react/vendor.js"
                }
            }
        </script>
        <script>
            // Boot-time instance-swap overlay gate kept for session route swaps.
            // Read synchronously before <body> renders so the first paint is the
            // overlay, not a half-loaded chat UI.
            try {
                if (
                    sessionStorage.getItem("pi-studio:swapping-instance") ===
                    "1"
                ) {
                    document.documentElement.classList.add(
                        "swapping-instance-pending",
                    );
                }
            } catch (_e) {}
        </script>
    </head>
    <body class="">
        <div
            class="instance-swap-overlay"
            id="instance-swap-overlay"
            aria-hidden="true"
        >
            <div class="instance-swap-overlay__spinner"></div>
            <div
                class="instance-swap-overlay__label"
                id="instance-swap-overlay-label"
            >
                Starting session…
            </div>
        </div>
        <script>
            // Flip the body class as early as the body element exists. Done inline
            // (rather than waiting for the native entry) so we don't get a chat-UI flash
            // between body parse and app.js executing.
            if (
                document.documentElement.classList.contains(
                    "swapping-instance-pending",
                )
            ) {
                document.body.classList.add("swapping-instance");
                document.documentElement.classList.remove(
                    "swapping-instance-pending",
                );
                const overlay = document.getElementById(
                    "instance-swap-overlay",
                );
                if (overlay) overlay.setAttribute("data-visible", "true");
            }
        </script>
        <div class="app-layout">
            <!-- Left Sidebar -->
            <div class="sidebar" id="sidebar">
                <div class="workspace-bar" id="workspace-bar">
                    <div
                        class="workspace-bar-label"
                        id="workspace-bar-label"
                        title=""
                    >
                        <span class="workspace-bar-icon" aria-hidden="true">📂</span>
                        <span class="workspace-bar-text">
                            <strong id="workspace-bar-name">…</strong>
                            <span id="workspace-bar-path"></span>
                        </span>
                    </div>
                    <button
                        type="button"
                        class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn workspace-bar-switcher"
                        id="workspace-switcher-btn"
                        title="Switch workspace (Ctrl+Shift+O)"
                        aria-label="Switch workspace"
                        aria-haspopup="menu"
                        aria-expanded="false"
                    >
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="M8 3 4 7l4 4" />
                            <path d="M4 7h16" />
                            <path d="m16 21 4-4-4-4" />
                            <path d="M20 17H4" />
                        </svg>
                    </button>
                    <div
                        class="workspace-switcher-menu hidden"
                        id="workspace-switcher-menu"
                        role="menu"
                        aria-label="Switch workspace"
                    ></div>
                </div>
                <div class="sidebar-header">
                    <div class="sidebar-search-wrap">
                        <input
                            type="text"
                            id="session-search-input"
                            class="ui-input ui-input--sm sidebar-search-input"
                            placeholder="Search..."
                            aria-label="Search sessions"
                            autocomplete="off"
                        />
                        <button
                            type="button"
                            id="session-search-clear"
                            class="sidebar-search-clear hidden"
                            title="Clear search"
                            aria-label="Clear search"
                        >
                            <svg
                                width="12"
                                height="12"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2.2"
                                stroke-linecap="round"
                            >
                                <line x1="18" y1="6" x2="6" y2="18" />
                                <line x1="6" y1="6" x2="18" y2="18" />
                            </svg>
                        </button>
                    </div>
                    <div class="sidebar-actions">
                        <button
                            class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn"
                            id="new-session-btn"
                            title="New session (Ctrl+Shift+N)"
                            aria-label="New session"
                        >
                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="12" y1="5" x2="12" y2="19" />
                                <line x1="5" y1="12" x2="19" y2="12" />
                            </svg>
                        </button>
                        <button
                            class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn"
                            id="refresh-sessions-btn"
                            title="Refresh sessions"
                            aria-label="Refresh sessions"
                        >
                            <svg
                                width="14"
                                height="14"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"
                                />
                                <path d="M21 3v5h-5" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="session-list" id="session-list">
                </div>
                <div class="sidebar-footer">
                    <button
                        class="sidebar-update-pill hidden"
                        id="sidebar-update-btn"
                        title="Download and install update"
                        aria-label="Download and install update"
                    >
                        Update
                    </button>
                </div>
            </div>

            <!-- Sidebar overlay for mobile -->
            <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

            <!-- Main Chat Area -->
            <div class="main">
                <!-- Header -->
                <div class="header session-header">
                    <div class="header-left">
                        <button
                            class="sidebar-toggle"
                            id="sidebar-toggle"
                            title="Toggle sidebar"
                            aria-label="Toggle sidebar"
                            aria-controls="sidebar"
                            aria-expanded="true"
                        >
                            <svg
                                width="18"
                                height="18"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <line x1="3" y1="6" x2="21" y2="6" />
                                <line x1="3" y1="12" x2="21" y2="12" />
                                <line x1="3" y1="18" x2="21" y2="18" />
                            </svg>
                        </button>
                        <button
                            class="ui-button ui-button--secondary ui-button--sm lan-qr-btn hidden"
                            id="lan-qr-btn"
                            title="Open on Mobile"
                            aria-label="Open on Mobile"
                        >
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <rect
                                    x="5"
                                    y="2"
                                    width="14"
                                    height="20"
                                    rx="2"
                                    ry="2"
                                />
                                <line x1="12" y1="18" x2="12.01" y2="18" />
                            </svg>
                            <span>Open on Mobile</span>
                        </button>
                        <div class="status">
                            <span
                                class="status-indicator"
                                id="status-indicator"
                            ></span>
                            <span class="status-text" id="status-text"
                                >Connecting...</span
                            >
                        </div>
                        <button
                            class="scene-indicator"
                            id="scene-indicator"
                            type="button"
                            data-scene="programming"
                            title="Current scene"
                        ></button>
                    </div>
                    <div class="header-right">
                        <span
                            class="pill session-cost"
                            id="session-cost"
                            title="Session cost"
                        ></span>
                        <span class="context-usage-anchor">
                            <span
                                class="pill token-usage"
                                id="token-usage"
                                title="Context usage"
                            ></span>
                            <div class="context-viz hidden" id="context-viz">
                                <div class="context-viz-title">
                                    Context Window
                                </div>
                                <div class="context-bar" id="context-bar"></div>
                                <div
                                    class="context-legend"
                                    id="context-legend"
                                ></div>
                                <div class="context-viz-footer">
                                    <span id="context-viz-used"></span>
                                    <span id="context-viz-total"></span>
                                </div>
                            </div>
                        </span>
                        <span
                            class="pill git-branch-indicator hidden"
                            id="git-branch-indicator"
                            title="Git branch"
                        ></span>

                        <button
                            class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn"
                            id="file-sidebar-toggle"
                            title="Files"
                            aria-label="Toggle file browser"
                        >
                            <svg
                                width="16"
                                height="16"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>


                <!-- Super Agent Chat Header web component (shown when SA is active) -->
                <sa-chat-header
                    class="super-agent-chat-header hidden"
                    id="super-agent-chat-header"
                ></sa-chat-header>

                <!-- Messages Container -->
                <div class="messages" id="messages">
                </div>

                <!-- Conversation navigator rail (Codex-style) -->
                <div class="conv-nav hidden" id="conv-nav" aria-label="Conversation navigator">
                    <!-- Dot track — populated by JS -->
                    <div class="conv-nav-track" id="conv-nav-track"></div>
                </div>

                <!-- Tooltip floated next to the rail — fixed-position, outside the rail
                     so it isn't clipped by any stacking context on the rail itself -->
                <div class="conv-nav-tooltip hidden" id="conv-nav-tooltip" aria-hidden="true">
                    <div class="conv-nav-tooltip-q" id="conv-nav-tooltip-q"></div>
                    <div class="conv-nav-tooltip-sep" id="conv-nav-tooltip-sep"></div>
                    <div class="conv-nav-tooltip-a" id="conv-nav-tooltip-a"></div>
                </div>

                <!-- New-message action kept separate from the desktop-only conversation rail -->
                <button
                    type="button"
                    class="ui-button ui-button--primary ui-button--sm conv-nav-new-badge hidden"
                    id="scroll-bottom-badge"
                    aria-label="Jump to latest message"
                >
                    Latest ↓
                </button>
                <div
                    class="conv-nav-live-status"
                    id="conv-nav-live-status"
                    role="status"
                    aria-live="polite"
                    aria-atomic="true"
                ></div>

                <!-- Input Area -->
                <div class="input-area">
                    <div id="composer-root"></div>
                </div>
            <!-- Super Agent Runtime Panel (right column, shown when SA active) -->
            <super-agent-runtime
                class="super-agent-runtime app-side-panel"
                id="super-agent-runtime"
            ></super-agent-runtime>


            <!-- File Browser (right sidebar) -->
            <div
                class="file-sidebar app-side-panel collapsed"
                id="file-sidebar"
            >
                <div class="file-sidebar-header app-side-panel-header">
                    <span class="file-sidebar-title" id="file-sidebar-title"
                        >Files</span
                    >
                    <button
                        class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn"
                        id="file-sidebar-up"
                        title="Parent directory"
                    >
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path d="m5 12 7-7 7 7" />
                            <path d="M12 19V5" />
                        </svg>
                    </button>
                    <button
                        class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn"
                        id="file-sidebar-finder"
                        title="Open in file manager"
                    >
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <path
                                d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"
                            />
                        </svg>
                    </button>
                    <button
                        class="ui-icon-button ui-icon-button--sm ui-icon-button--ghost icon-btn app-side-panel-close-btn"
                        id="file-sidebar-close"
                        title="Close"
                        aria-label="Close file browser"
                    >
                        <svg
                            width="14"
                            height="14"
                            viewBox="0 0 24 24"
                            fill="none"
                            stroke="currentColor"
                            stroke-width="2"
                            stroke-linecap="round"
                            stroke-linejoin="round"
                        >
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
                <div
                    class="file-sidebar-path"
                    id="file-sidebar-path"
                    title=""
                ></div>
                <div class="file-list" id="file-list"></div>
            </div>
        </div>

        <div
            class="help-center-overlay hidden"
            id="help-center-overlay"
        ></div>
        <section
            class="help-center hidden"
            id="help-center"
            aria-label="ZiCode Help"
        >
            <header class="help-center-header">
                <button
                    class="ui-button ui-button--ghost help-center-brand"
                    id="help-center-home"
                    type="button"
                >
                    ZiCode Help
                </button>
                <span
                    class="help-center-page-title"
                    id="help-center-page-title"
                ></span>
                <button
                    class="ui-icon-button ui-icon-button--ghost help-center-close"
                    id="help-center-close"
                    type="button"
                    aria-label="Close Help"
                >
                    ×
                </button>
            </header>
            <div class="help-center-layout">
                <nav
                    class="help-center-navigation"
                    id="help-center-navigation"
                    aria-label="Help navigation"
                ></nav>
                <article
                    class="help-center-article markdown-body"
                    id="help-center-article"
                ></article>
                <nav
                    class="help-center-toc"
                    id="help-center-toc"
                    aria-label="On this page"
                ></nav>
            </div>
        </section>

        <div id="settings-root"></div>

        <!-- Global Session Search (React shell root) -->
        <div id="session-search-dialog-root"></div>

        <!-- Command Palette -->
        <div
            class="command-palette-overlay hidden"
            id="command-palette-overlay"
        ></div>
        <div class="command-palette hidden" id="command-palette">
            <div class="command-palette-header">Commands</div>
            <div class="command-list" id="command-list"></div>
        </div>


        <!-- Dialog Container -->
        <div id="dialog-container" class="hidden"></div>

        <!-- LAN QR Code Modal -->
        <div
            class="lan-qr-modal hidden"
            id="lan-qr-modal"
            role="dialog"
            aria-modal="true"
            aria-label="Mobile QR code"
        >
        </div>
        </div>

        <!-- Scripts -->
        <script type="module" src="bootstrap-entry.js"></script>
        <script type="module" src="components/super-agent-entry.js"></script>
        <script type="module" src="components/super-agent-runtime.js"></script>
        <script type="module" src="components/sa-chat-header.js"></script>
        <script type="module" src="components/chat-settings-panel.js"></script>
        <script type="module" src="super-agent/panel.js"></script>
    </body>
</html>
