[package]
name = "studio-alibaba-mail"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
base64 = "0.22"
imap-proto = "0.10"
imap = { version = "2.4", default-features = false }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }
mail-parser = { version = "1", features = ["full_encoding"] }
native-tls = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[dev-dependencies]
rcgen = "0.13"
rustls = { version = "0.23", features = ["aws-lc-rs"] }
tempfile = "3"
