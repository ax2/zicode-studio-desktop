[package]
name = "zicode-studio-desktop"
version = "0.1.0"
description = "Self-contained multi-scene AI desktop workspace powered by Pi and Tauri"
authors = ["Alex Xiang and contributors"]
edition = "2021"
default-run = "zicode-studio-desktop"

[[bin]]
name = "zicode-studio-desktop"
path = "src/main.rs"

[[bin]]
name = "zicode-relay"
path = "src/bin/relay.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "devtools", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
tokio-rustls = "0.26"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "blocking", "system-proxy"] }
dirs = "5"
log = "0.4"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
futures-util = "0.3"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
percent-encoding = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
boa_engine = "0.21"
ed25519-dalek = "2"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
local-ip-address = "0.6"
pem = "3"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }
rustls = { version = "0.23", features = ["aws-lc-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
scraper = "0.21"
encoding_rs = "0.8"
ego-tree = "0.9"
pdf-extract = "0.7.3"
quick-xml = "0.37"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
keyring = { version = "4.1.5", features = ["v1"] }
wasmtime = { version = "36.0.2", default-features = false, features = ["cranelift", "runtime", "std", "wat"] }
wasmtime-wasi = { version = "36.0.2", default-features = false, features = ["preview1"] }
snow = "0.9"
x25519-dalek = { version = "2", features = ["static_secrets"] }
bytes = "1"
webrtc = "0.13"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
x509-parser = "0.16"
