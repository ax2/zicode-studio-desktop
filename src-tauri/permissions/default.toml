[[permission]]
identifier = "allow-get-project-resource-entry"
description = "Allow a trusted workspace window to inspect its explicit file launch name without reading content."
commands.allow = ["get_project_resource_entry"]

[[permission]]
identifier = "allow-get-project-resource-entries"
description = "Allow a trusted workspace window to inspect explicit selected file names without reading content."
commands.allow = ["get_project_resource_entries"]

[[permission]]
identifier = "allow-get-project-directory-entry"
description = "Allow a trusted workspace window to detect its explicit project directory launch without enumerating contents."
commands.allow = ["get_project_directory_entry"]

[[permission]]
identifier = "allow-desktop-entry-mode"
description = "Allow a trusted workspace window to identify its explicit desktop launch mode."
commands.allow = ["desktop_entry_mode"]


[[permission]]
identifier = "allow-select-result-text-export"
description = "Allow trusted workspace select of an exact captured text result using a native-selected create-new destination."
commands.allow = ["select_result_text_export"]

[[permission]]
identifier = "allow-commit-result-text-export"
description = "Allow trusted workspace commit of an exact captured text result using a native-selected create-new destination."
commands.allow = ["commit_result_text_export"]

[[permission]]
identifier = "allow-cancel-result-text-export"
description = "Allow trusted workspace cancel of an exact captured text result using a native-selected create-new destination."
commands.allow = ["cancel_result_text_export"]

[[permission]]
identifier = "allow-verify-result-text-export"
description = "Allow trusted workspace verify of an exact captured text result using a native-selected create-new destination."
commands.allow = ["verify_result_text_export"]

[[permission]]
identifier = "allow-start-system-temperature-monitor"
description = "Allow a trusted workspace to request Windows elevation for its CPU-only sensor reader using an already installed LibreHardwareMonitor and PawnIO."
commands.allow = ["start_system_temperature_monitor"]

[[permission]]
identifier = "allow-stop-system-temperature-monitor"
description = "Allow a trusted workspace to stop only Studio's own CPU sensor reader."
commands.allow = ["stop_system_temperature_monitor"]

[[permission]]
identifier = "allow-get-system-information"
description = "Read local CPU, memory, fixed disks and available hardware temperature sensors."
commands.allow = ["get_system_information"]

[[permission]]
identifier = "allow-check-desktop-update"
description = "Allow the trusted desktop window to check desktop update using the configured signed feed."
commands.allow = ["check_desktop_update"]

[[permission]]
identifier = "allow-install-desktop-update"
description = "Allow the trusted desktop window to install desktop update using the configured signed feed."
commands.allow = ["install_desktop_update"]

[[permission]]
identifier = "allow-restart-desktop-after-update"
description = "Allow the trusted desktop window to restart desktop after update using the configured signed feed."
commands.allow = ["restart_desktop_after_update"]

[[permission]]
identifier = "allow-browser-get-state"
description = "Read browser metadata for the calling trusted workspace window."
commands.allow = ["browser_get_state"]

[[permission]]
identifier = "allow-browser-set-startup-mode"
description = "Persist the browser or workspace startup preference from trusted desktop chrome."
commands.allow = ["browser_set_startup_mode"]

[[permission]]
identifier = "allow-browser-set-search-engine"
description = "Persist a fixed search provider from trusted workspace chrome."
commands.allow = ["browser_set_search_engine"]

[[permission]]
identifier = "allow-browser-save-session"
description = "Save the calling trusted window browser session with revision conflict protection."
commands.allow = ["browser_save_session"]

[[permission]]
identifier = "allow-browser-control"
description = "Allow trusted workspace chrome to manage only its own isolated native browser tabs."
commands.allow = ["browser_control"]

[[permission]]
identifier = "allow-browser-capture-page"
description = "Allow trusted chrome to explicitly read bounded text from its own browser tab with navigation checks; never execute caller-supplied scripts."
commands.allow = ["browser_capture_page"]

[[permission]]
identifier = "allow-browser-read-article"
description = "Read a bounded article from the owning workspace's browser tab for local reading mode."
commands.allow = ["browser_read_article"]

[[permission]]
identifier = "allow-browser-read-selection"
description = "Read the selected visible text in the owning browser tab for an explicit local action."
commands.allow = ["browser_read_selection"]

[[permission]]
identifier = "allow-browser-bookmarks"
description = "Allow trusted workspace chrome to manage only its own durable bookmarks."
commands.allow = ["browser_bookmarks"]

[[permission]]
identifier = "allow-browser-bookmark-file"
description = "Import or export bookmarks through an explicit native file picker in trusted workspace chrome."
commands.allow = ["browser_bookmark_file"]

[[permission]]
identifier = "allow-browser-history"
description = "Read and explicitly remove the owning workspace browsing history."
commands.allow = ["browser_history"]

[[permission]]
identifier = "allow-desktop-window-control"
description = "Allow verified Studio chrome to control only its own native workspace window."
commands.allow = ["desktop_window_control"]
