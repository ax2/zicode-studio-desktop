"$schema" = "../gen/schemas/desktop-schema.json"

# App-local Tauri command permissions. Every custom command registered in
# `tauri::generate_handler!` (main.rs) must be declared here and included in
# the [default] set, which the capability references.

[[permission]]
identifier = "allow-set-desktop-tool-shortcuts"
description = "Allow a trusted workspace to project up to eight navigation-only tool shortcuts into the native tray."
commands.allow = ["set_desktop_tool_shortcuts"]

[[permission]]
identifier = "allow-open-desktop-tool-center"
description = "Allow a trusted workspace to restore the independent Host-owned tool center window."
commands.allow = ["open_desktop_tool_center"]

[[permission]]
identifier = "allow-set-desktop-tray-locale"
description = "Allow a trusted workspace to update native tray labels to the selected interface language."
commands.allow = ["set_desktop_tray_locale"]

[[permission]]
identifier = "allow-open-folder-as-workspace"
description = "Allow opening the native folder picker to spawn a new workspace window."
commands.allow = ["open_folder_as_workspace"]

[[permission]]
identifier = "allow-select-developer-plugin-package"
description = "Allow selecting and validating a local developer plugin package without installation."
commands.allow = ["select_developer_plugin_package"]

[[permission]]
identifier = "allow-install-previewed-developer-plugin"
description = "Allow installing a developer plugin only after its previewed content digest is rechecked."
commands.allow = ["install_previewed_developer_plugin"]

[[permission]]
identifier = "allow-select-signed-plugin-package"
description = "Allow selecting and cryptographically previewing a signed ZiCode plugin package."
commands.allow = ["select_signed_plugin_package"]

[[permission]]
identifier = "allow-install-signed-plugin-package"
description = "Allow installing a verified signed ZiCode plugin after publisher confirmation."
commands.allow = ["install_signed_plugin_package"]

[[permission]]
identifier = "allow-rollback-signed-plugin-package"
description = "Allow atomically rolling a signed plugin back to a retained version."
commands.allow = ["rollback_signed_plugin_package"]

[[permission]]
identifier = "allow-revoke-plugin-publisher"
description = "Allow revoking a signed plugin publisher and disabling its plugins."
commands.allow = ["revoke_plugin_publisher"]

[[permission]]
identifier = "allow-open-new-session-in-workspace"
description = "Allow opening a fresh session in the current workspace window."
commands.allow = ["open_new_session_in_workspace"]

[[permission]]
identifier = "allow-switch-window-workspace"
description = "Allow switching the current window to another workspace without leaving the active application."
commands.allow = ["switch_window_workspace"]

[[permission]]
identifier = "allow-open-session-in-project"
description = "Allow opening or focusing a project's workspace window at a saved session."
commands.allow = ["open_session_in_project"]

[[permission]]
identifier = "allow-ensure-agent-inbox-session"
description = "Allow bootstrapping the fixed Agent Inbox workspace and background runtime."
commands.allow = ["ensure_agent_inbox_session"]

[[permission]]
identifier = "allow-check-beta-update"
description = "Allow checking the prerelease ZiCode Studio Desktop updater channel."
commands.allow = ["check_beta_update"]

[[permission]]
identifier = "allow-install-beta-update"
description = "Allow installing an available prerelease ZiCode Studio Desktop update."
commands.allow = ["install_beta_update"]

[[permission]]
identifier = "allow-list-scene-profiles"
description = "Allow listing built-in and custom desktop scene profiles."
commands.allow = ["list_scene_profiles"]

[[permission]]
identifier = "allow-save-scene-profile"
description = "Allow saving a validated custom desktop scene profile."
commands.allow = ["save_scene_profile"]

[[permission]]
identifier = "allow-delete-scene-profile"
description = "Allow deleting a custom desktop scene profile."
commands.allow = ["delete_scene_profile"]

[[permission]]
identifier = "allow-store-scene-credential"
description = "Allow storing a provider credential in the operating system credential vault."
commands.allow = ["store_scene_credential"]

[[permission]]
identifier = "allow-delete-scene-credential"
description = "Allow removing a provider credential from the operating system credential vault."
commands.allow = ["delete_scene_credential"]

[[permission]]
identifier = "allow-scene-credential-status"
description = "Allow checking whether a scene provider credential exists without reading its value."
commands.allow = ["scene_credential_status"]

[[permission]]
identifier = "allow-send-desktop-notification"
description = "Allow showing a Windows system notification for background work."
commands.allow = ["send_desktop_notification"]

[[permission]]
identifier = "allow-publish-notes-notebook"
description = "Allow explicitly building a local Notes notebook as an Astro static site."
commands.allow = ["publish_notes_notebook"]

[[permission]]
identifier = "allow-list-workspaces"
description = "Allow listing registered workspaces for the desktop workspace switcher."
commands.allow = ["list_workspaces"]

[[permission]]
identifier = "allow-delete-workspace"
description = "Allow deleting a workspace with recycle-bin semantics (app data moves to trash)."
commands.allow = ["delete_workspace"]

[[permission]]
identifier = "allow-list-workspace-trash"
description = "Allow listing recoverable deleted workspaces in the recycle bin."
commands.allow = ["list_workspace_trash"]

[[permission]]
identifier = "allow-delete-workspace-trash-entry"
description = "Allow permanently deleting one recycle bin entry."
commands.allow = ["delete_workspace_trash_entry"]

[[permission]]
identifier = "allow-empty-workspace-trash"
description = "Allow emptying the workspace recycle bin."
commands.allow = ["empty_workspace_trash"]

[[permission]]
identifier = "allow-restore-workspace"
description = "Allow restoring a deleted workspace from the recycle bin."
commands.allow = ["restore_workspace"]

[[permission]]
identifier = "allow-create-workspace-backup"
description = "Allow snapshotting the current workspace's app data into ~/.zicode/backups."
commands.allow = ["create_workspace_backup"]

[[permission]]
identifier = "allow-list-workspace-backups"
description = "Allow listing available workspace data snapshots."
commands.allow = ["list_workspace_backups"]

[[permission]]
identifier = "allow-delete-workspace-backup"
description = "Allow permanently removing one workspace data snapshot."
commands.allow = ["delete_workspace_backup"]

[[permission]]
identifier = "allow-restore-workspace-backup"
description = "Allow queuing a confirmed workspace snapshot restore for the next startup."
commands.allow = ["restore_workspace_backup"]

[[permission]]
identifier = "allow-workspace-restore-outcome"
description = "Allow reading the registered workspace's last restore result."
commands.allow = ["workspace_restore_outcome"]

[[permission]]
identifier = "allow-list-automation-workspaces"
description = "Allow reading registered workspaces' automation status."
commands.allow = ["list_automation_workspaces"]

[[permission]]
identifier = "allow-background-automation-worker-status"
description = "Allow reading this device's background automation worker status."
commands.allow = ["background_automation_worker_status"]

[[permission]]
identifier = "allow-start-background-automation-worker"
description = "Allow explicitly starting this device's background automation worker."
commands.allow = ["start_background_automation_worker"]

[[permission]]
identifier = "allow-stop-background-automation-worker"
description = "Allow explicitly stopping this device's background automation worker."
commands.allow = ["stop_background_automation_worker"]

[[permission]]
identifier = "allow-background-automation-login-start-enabled"
description = "Allow reading this device's automation login-start setting."
commands.allow = ["background_automation_login_start_enabled"]

[[permission]]
identifier = "allow-set-background-automation-login-start"
description = "Allow changing this device's automation login-start setting."
commands.allow = ["set_background_automation_login_start"]

[[permission]]
identifier = "allow-prepare-background-automation-worker-for-update"
description = "Allow coordinating the background worker before an application update."
commands.allow = ["prepare_background_automation_worker_for_update"]

[[permission]]
identifier = "allow-finish-background-automation-worker-update"
description = "Allow completing background worker coordination after an update attempt."
commands.allow = ["finish_background_automation_worker_update"]

[[permission]]
identifier = "allow-inspect-project-storage"
description = "Allow reading generated-directory size summaries within a registered workspace."
commands.allow = ["inspect_project_storage"]

[[permission]]
identifier = "allow-desktop-explorer-menu"
description = "Allow explicit current-user Explorer menu configuration from the desktop workspace."
commands.allow = ["desktop_explorer_menu"]

[[permission]]
identifier = "allow-select-project-resource-file"
description = "Allow a trusted workspace window to select a file inside its current registered project; selection does not share content."
commands.allow = ["select_project_resource_file"]

[[permission]]
identifier = "allow-select-project-resource-directory"
description = "Allow a trusted workspace window to select a directory inside its current registered project; selection does not enumerate entries."
commands.allow = ["select_project_resource_directory"]

[[permission]]
identifier = "allow-select-resource-export"
description = "Allow a trusted workspace to select a new local export destination; selection alone never writes."
commands.allow = ["select_resource_export"]

[[permission]]
identifier = "allow-commit-resource-export"
description = "Allow explicit confirmation of a window-bound output export without replacing existing files."
commands.allow = ["commit_resource_export"]

[[permission]]
identifier = "allow-cancel-resource-export"
description = "Allow discarding an uncommitted native export choice."
commands.allow = ["cancel_resource_export"]

[[permission]]
identifier = "allow-verify-resource-export"
description = "Allow read-only verification of an explicitly saved local export."
commands.allow = ["verify_resource_export"]

[[permission]]
identifier = "allow-visual-assets-control"
description = "Allow trusted workspace windows to browse the local visual library and import explicitly selected images."
commands.allow = ["visual_assets_control"]

[default]
description = "Default set of ZiCode Studio Desktop app command permissions."
permissions = [
    "allow-visual-assets-control",
    "allow-desktop-window-control",
  "allow-select-result-text-export",
  "allow-commit-result-text-export",
  "allow-cancel-result-text-export",
  "allow-verify-result-text-export",

  "allow-select-resource-export",
