  "allow-browser-save-session",
  "allow-browser-bookmarks",
  "allow-browser-bookmark-file",
  "allow-browser-history",
  "allow-start-system-temperature-monitor",
  "allow-stop-system-temperature-monitor",
  "allow-check-desktop-update",
