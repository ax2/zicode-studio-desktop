name: Desktop release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to build and publish
        required: true
        type: string
      publish:
        description: Publish once the selected build and installer acceptance gates pass
        required: true
        type: boolean
        default: false
      platform:
        description: Windows by default; all requires explicit user request; Intel-only repair never publishes
        required: true
        default: windows
        type: choice
        options:
          - windows
          - all
          - macos-intel

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      release_sha: ${{ steps.release-source.outputs.sha }}
      app_version: ${{ steps.release-source.outputs.version }}
      build_matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout workflow matrix source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve fixed matrix tool
        shell: bash
        run: cp scripts/release-build-matrix.mjs scripts/check-release-notes-inputs.mjs "$RUNNER_TEMP/"
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Record release source commit
        id: release-source
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --verify HEAD)"
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid release commit SHA"; exit 1; }
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check frozen release notes and issue snapshot before building
        run: node "$RUNNER_TEMP/check-release-notes-inputs.mjs" "$RELEASE_TAG"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Select explicit build scope
        id: build-matrix
        env:
          RELEASE_PLATFORM: ${{ inputs.platform || 'windows' }}
        run: bun "$RUNNER_TEMP/release-build-matrix.mjs"

      - name: Verify release repository
        run: bun scripts/check-release-repository.mjs --ci

      - name: Verify tag matches application versions
        run: bun run scripts/check-release-version.js "$RELEASE_TAG"

      - name: Verify release asset policy matches updater configuration
        run: |
          bun -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8"));
            if (config.bundle?.createUpdaterArtifacts !== false) {
              throw new Error("Release inventory permits only installers for the selected platforms. Update the publish inventory and signature checks before enabling updater artifacts.");
            }
          '

  build:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.build_matrix) }}
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      PI_TARGET_PLATFORM: ${{ matrix.pi_target }}

    steps:
      # Verification infrastructure is pinned independently of the immutable
      # application tag, allowing packaging checks to be maintained without
      # changing the application source or creating another application version.
      - name: Enable long paths for Windows checkout
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true

      - name: Checkout verification workflow source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}

      - name: Preserve pinned release verification tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/studio-release-verifier"
          cp scripts/verify-release-artifacts.mjs scripts/release-draft-assets.mjs \
            scripts/release-artifact-policy.mjs scripts/release-candidate-files.mjs scripts/release-build-matrix.mjs scripts/verify-release-inventory.mjs scripts/executable-architecture.mjs \
            scripts/macos-bundle-signing.mjs scripts/verify-macos-dmg.mjs scripts/verify-windows-installer-runtime.ps1 \
            "$RUNNER_TEMP/studio-release-verifier/"
          echo "Verification workflow source: ${{ github.workflow_sha }}"

      - name: Checkout pinned release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare-release.outputs.release_sha }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils dunst xvfb dbus-x11

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release runner matches embedded runtime target
        run: bun scripts/check-release-target.mjs

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml places Cargo output at the repository root.
          workspaces: "src-tauri -> ../target"
          # Match the existing platform job's key + GITHUB_JOB suffix so the
          # release can restore its checked dependencies without a new cache tree.
          shared-key: developer-platform-${{ matrix.os }}-platform
          # Other tags cannot restore a cache written by this release tag.
          save-if: ${{ runner.os != 'Windows' || github.event_name != 'push' || github.ref_type != 'tag' }}
          cache-on-failure: true

      - name: Cache embedded runtimes
        uses: actions/cache@v5
        with:
          path: |
            .cache/pi-binaries
            .cache/portable-git
            .cache/webview2
            .cache/bun-runtime
          key: ${{ matrix.pi_target }}-runtimes-${{ hashFiles('scripts/pi-version.json', 'scripts/portable-git-version.json', 'scripts/webview2-version.json', 'scripts/bun-runtime-version.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch embedded Pi
        run: bun run fetch:pi

      - name: Fetch Portable Git
        run: bun run fetch:portable-git

      - name: Fetch WebView2 installer
        run: bun run fetch:webview2

      - name: Fetch embedded Bun
        run: bun run fetch:bun-runtime

      - name: Verify embedded Pi on Unix
        if: runner.os != 'Windows'
        run: |
          ./src-tauri/resources/pi/pi --version
          ./src-tauri/resources/bun/bun --version

      - name: Verify embedded executable architectures
        run: bun scripts/check-runtime-architecture.mjs

      - name: Verify isolated embedded Pi RPC contract
        run: bun run smoke:pi-rpc

      - name: Verify embedded Windows runtimes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          .\src-tauri\resources\pi\pi.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Embedded Pi failed to start" }
          .\src-tauri\resources\portable-git\cmd\git.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Portable Git failed to start" }
          .\src-tauri\resources\portable-git\bin\bash.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Portable Bash failed to start" }
          .\src-tauri\resources\bun\bun.exe --version
          if ($LASTEXITCODE -ne 0) { throw "Embedded Bun failed to start" }
          $lock = Get-Content .\scripts\webview2-version.json | ConvertFrom-Json
          $actual = (Get-FileHash .\src-tauri\resources\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $lock.assets.'windows-x64'.sha256) { throw "WebView2 SHA-256 mismatch" }

      - name: Build bundled extensions
        run: bun run build:extensions

      - name: Verify bundled bridge registration with embedded Pi
        run: bun scripts/smoke-finance-extension.js

      - name: Verify bundled Inbox and plugin tool registration
        run: bun scripts/smoke-finance-extension.js --inbox

      - name: Check frontend TypeScript
        run: bun run typecheck

      - name: Check external clients TypeScript
        run: bun run typecheck:external-clients

      - name: Check finance core TypeScript
        run: bun run typecheck:finance-core

      - name: Check chat inbox core TypeScript
        run: bun run typecheck:chat-inbox-core

      - name: Check platform core TypeScript
        run: bun run typecheck:platform-core

      - name: Check bundled extension entrypoints TypeScript
        run: bun run typecheck:extensions-source

      - name: Check lint and design rules
        run: bun run check

      - name: Test frontend and packaging guards
        run: bun run test

      - name: Check Rust on Unix
        if: runner.os != 'Windows'
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a dbus-run-session -- bash scripts/with-linux-notifications.sh bash scripts/check-rust.sh
          else
            bash scripts/check-rust.sh
          fi

      - name: Check Rust on Windows
        if: runner.os == 'Windows'
        env:
          RUST_TEST_THREADS: "2"
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        shell: pwsh
        run: .\src-tauri\resources\portable-git\bin\bash.exe scripts/check-rust.sh

      - name: Verify real Pi to Host plugin invocation
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --bin zicode-studio-desktop host_server::plugin_broker_tests::embedded_pi_invokes_the_real_host_plugin_broker -- --ignored --exact

      - name: Prepare Windows Explorer selection bridge
        if: runner.os == 'Windows'
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
        run: bun scripts/build-desktop.js --shell-only

      - name: Prepare macOS packaging hook
        if: runner.os == 'macOS'
        id: macos-bundle-config
        shell: bash
        run: |
          set -euo pipefail
          bun "$RUNNER_TEMP/studio-release-verifier/macos-bundle-signing.mjs" --prepare
          echo "args=--config \"$RUNNER_TEMP/studio-release-verifier/macos-bundle.json\"" >> "$GITHUB_OUTPUT"

      - name: Build local platform bundles
        shell: bash
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
          CARGO_NET_RETRY: "10"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build --bundles ${{ matrix.bundles }} ${{ runner.os == 'Windows' && '--config src-tauri/tauri.shell.windows.conf.json' || '' }} ${{ steps.macos-bundle-config.outputs.args }}

      - name: Verify actual Windows installer process guards and installation
        id: installer-acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          STUDIO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          $files = @(Get-ChildItem -LiteralPath target/release/bundle/nsis -Filter '*_x64-setup.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          # An older public version is used only to set up the upgrade. No credentials or draft release access.
          $baseline = Join-Path $env:RUNNER_TEMP 'studio-upgrade-baseline-0.6.2.exe'
          $argsForBaseline = @{}
          if ([version]($env:RELEASE_TAG.Substring(1).Split('-')[0]) -gt [version]'0.6.2') {
            curl.exe --fail --location --silent --show-error --max-time 120 --output $baseline 'https://github.com/ax2/zicode-studio-desktop/releases/download/v0.6.2/ZiCode.Studio.Desktop_0.6.2_x64-setup.exe'
            if ($LASTEXITCODE -eq 0) {
              $argsForBaseline = @{ PreviousInstaller=$baseline; PreviousSha256='e6f18ac3d4de6dfab123755ff75cb3ca7cd6486ed4a11619c5269d8760abdb9c' }
            } else {
              Write-Warning 'Public upgrade baseline unavailable; upgrade cases will be recorded as skipped.'
              $global:LASTEXITCODE = 0
            }
          }
          & "$env:RUNNER_TEMP/studio-release-verifier/verify-windows-installer-runtime.ps1" -Installer $files[0].FullName -Version ($env:RELEASE_TAG.Substring(1)) -Receipt "$env:RUNNER_TEMP/studio-installer-acceptance.json" @argsForBaseline

      - name: Retain Windows installer acceptance receipt
        if: always() && runner.os == 'Windows' && steps.installer-acceptance.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-acceptance-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/studio-installer-acceptance.json
          if-no-files-found: error
          retention-days: 14

      - name: Keep failed Windows installer for diagnosis
        if: failure() && runner.os == 'Windows' && steps.installer-acceptance.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-installer-${{ env.RELEASE_TAG }}
          path: target/release/bundle/nsis/*_x64-setup.exe
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Extract Windows candidate for local acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/export-windows-candidate.ps1

      - name: Retain Windows acceptance candidate
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/studio-windows-candidate/
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true

      - name: Verify macOS application signatures and embedded runtimes
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(target/release/bundle/dmg/*.dmg)
          [[ "${#DMGS[@]}" == 1 ]] || { echo "Expected exactly one final DMG"; exit 1; }
          PI_VERSION="$(bun -e 'console.log(require("./scripts/pi-version.json").version)')"
          bun "$RUNNER_TEMP/studio-release-verifier/verify-macos-dmg.mjs" \
            "${DMGS[0]}" "$PI_TARGET_PLATFORM" "${RELEASE_TAG#v}" "$PI_VERSION"

      - name: Verify and stage platform bundles
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
        run: bun "$RUNNER_TEMP/studio-release-verifier/verify-release-artifacts.mjs" "${{ matrix.bundles }}"

      - name: Retain verified platform bundles
        uses: actions/upload-artifact@v4
        with:
          name: verified-bundles-${{ matrix.pi_target }}
          path: ${{ runner.temp }}/studio-verified-bundles/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  verify-inventory:
    needs: [prepare-release, build]
    runs-on: ubuntu-22.04
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      RELEASE_PLATFORM: ${{ inputs.platform || 'windows' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-bundles-*
          path: ${{ runner.temp }}/bundles
      - name: Check complete candidate inventory and digests
        run: node scripts/release-candidate-files.mjs "$RUNNER_TEMP/bundles" "$RUNNER_TEMP/verified"

  publish-release:
    if: github.event_name == 'push' || (inputs.publish == true && (inputs.platform == 'windows' || inputs.platform == 'all'))
    needs: [prepare-release, verify-inventory]
    runs-on: ubuntu-22.04
    concurrency:
      group: studio-public-release
      cancel-in-progress: false
    permissions:
      contents: write
      issues: read
    env:
      APP_VERSION: ${{ needs.prepare-release.outputs.app_version }}
      RELEASE_SHA: ${{ needs.prepare-release.outputs.release_sha }}
      RELEASE_PLATFORM: ${{ inputs.platform || 'windows' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - uses: actions/download-artifact@v4
        with:
          pattern: verified-bundles-*
          path: ${{ runner.temp }}/bundles
      - name: Publish verified installers and issue notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/release-candidate-files.mjs "$RUNNER_TEMP/bundles" "$RUNNER_TEMP/publish" > "$RUNNER_TEMP/verified-inventory.json"
          git fetch --no-tags origin "refs/tags/$RELEASE_TAG"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$RELEASE_SHA" ]] || { echo "::error::Release tag moved"; exit 1; }
          base="$RELEASE_SHA:docs/releases/$RELEASE_TAG.md"
          git show "$base" > "$RUNNER_TEMP/base-notes.md"
          # Use the issue snapshot from the exact application commit, even on manual dispatch.
          # The renderer itself stays pinned to the workflow commit.
          snapshot="docs/releases/$RELEASE_TAG.issues.json"
          git cat-file -e "$RELEASE_SHA:$snapshot" || { echo "::error::Frozen release issue snapshot is missing: $snapshot"; exit 1; }
          mkdir -p docs/releases
          git show "$RELEASE_SHA:$snapshot" > "$snapshot"
          node scripts/render-release-issues.mjs "$RELEASE_TAG" "$RUNNER_TEMP/base-notes.md" "$RUNNER_TEMP/release-notes.md"
          node scripts/publish-verified-release.mjs "$RUNNER_TEMP/publish" "$RUNNER_TEMP/verified-inventory.json" "$RUNNER_TEMP/release-notes.md"
