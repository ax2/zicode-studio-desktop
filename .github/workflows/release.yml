name: Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-build-release:
    runs-on: windows-2022
    env:
      PI_TARGET_PLATFORM: windows-x64
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache embedded runtimes
        uses: actions/cache@v5
        with:
          path: |
            .cache/pi-binaries
            .cache/portable-git
            .cache/webview2
          key: windows-runtimes-${{ hashFiles('scripts/pi-version.json', 'scripts/portable-git-version.json', 'scripts/webview2-version.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch and verify embedded runtimes
        shell: pwsh
        run: |
          bun run fetch:pi
          bun run fetch:portable-git
          bun run fetch:webview2
          .\src-tauri\resources\pi\pi.exe --version
          .\src-tauri\resources\portable-git\cmd\git.exe --version
          .\src-tauri\resources\portable-git\bin\bash.exe --version
          $lock = Get-Content .\scripts\webview2-version.json | ConvertFrom-Json
          $actual = (Get-FileHash .\src-tauri\resources\webview2\MicrosoftEdgeWebView2RuntimeInstallerX64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $lock.assets.'windows-x64'.sha256) { throw "WebView2 SHA-256 mismatch" }

      - name: Build bundled extensions
        run: bun run build:extensions

      - name: Test frontend and packaging guards
        run: bun run test

      - name: Check Rust
        shell: pwsh
        run: .\src-tauri\resources\portable-git\bin\bash.exe scripts/check-rust.sh

      - name: Build installers and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "ZiCode Studio Desktop ${{ github.ref_name }}"
          releaseBody: |
            Automated Windows x64 release for `${{ github.ref_name }}`.

            The NSIS installer includes the pinned Pi runtime and
            PortableGit distribution (Git + Bash), and the pinned Microsoft
            WebView2 offline installer; no separate runtime install is required.
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles nsis
