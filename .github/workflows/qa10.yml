name: Isolated Windows shell acceptance
on:
  push:
    branches: [codex/qa179-web]
    paths: ['.github/workflows/qa10.yml', 'scripts/qa/shell35/**']
permissions:
  contents: read
  actions: read
jobs:
  shell:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa/shell35
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ua179-test-app
          run-id: 44483353063
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/from067
          merge-multiple: true
      - name: Prepare the already accepted production shell with its test version label
        run: ./scripts/qa/shell35/prepare.ps1
      - uses: actions/checkout@v4
        with:
          ref: 624d307d6a8a2301eb1fc98dee90895a244ae46f
          persist-credentials: false
          path: candidate-ui
          sparse-checkout: public/native/browser
      - name: Install final matched UI-only input correction
        run: |
          $dest=(Get-Item -LiteralPath $env:STUDIO_Q35_EXE).DirectoryName
          Copy-Item candidate-ui/public/native/browser/browser-user-agent-settings.js "$dest/public/native/browser/browser-user-agent-settings.js"
          Copy-Item candidate-ui/public/style.bundle.css "$dest/public/style.bundle.css"
      - name: Read the request headers at an owned HTTPS server in two browser profiles
        working-directory: scripts/qa/shell35
        run: |
          $driver=Join-Path $env:RUNNER_TEMP 'shell-driver'
          [void][IO.Directory]::CreateDirectory($driver)
          Copy-Item -LiteralPath qa.mjs,native.ps1 -Destination $driver
          Set-Location $driver
          npm install --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.56.1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          node qa.mjs
