name: Documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release notes and issue plans
        shell: bash
        run: |
          current=v$(node -p 'require("./package.json").version')
          if [[ -f "docs/releases/$current.md" && ! -f "docs/releases/$current.issues.json" ]]; then
            echo "::error::Missing issue plan for $current"
            exit 1
          fi
          for plan in docs/releases/v*.*.*.issues.json; do
            name=${plan##*/}
            node scripts/check-release-notes-inputs.mjs "${name%.issues.json}"
          done
          node --test scripts/render-release-issues.test.mjs

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install documentation dependencies
        run: pip install --requirement requirements-docs.txt

      - name: Build documentation
        run: mkdocs build --strict

      - name: Upload documentation artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

