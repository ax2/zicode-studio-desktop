name: Windows tool entry acceptance
on:
  push:
    branches: [codex/qa30-tools]
    paths: ['.github/workflows/qa30.yml', 'scripts/qa/tools30/**']
permissions:
  contents: read
  actions: read
jobs:
  shell:
    runs-on: windows-2022
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/qa/tools30
            tests/fixtures/devtools-text-candidate03
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: 14494219496
          run-id: 44448986884
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/from067
          merge-multiple: true
      - name: Prepare the already accepted production shell with its test version label
        run: ./scripts/qa/tools30/prepare.ps1
      - name: Verify composed browser pixels and native window restoration
        working-directory: scripts/qa/tools30
        run: |
          $driver=Join-Path $env:RUNNER_TEMP 'shell-driver'
          [void][IO.Directory]::CreateDirectory($driver)
          Copy-Item -LiteralPath qa.mjs,native.ps1 -Destination $driver
          $env:Q30_PACKAGE=(Resolve-Path ../../../tests/fixtures/devtools-text-candidate03).Path
          Set-Location $driver
          npm install --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.56.1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          node qa.mjs
