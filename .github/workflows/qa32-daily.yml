name: Windows daily profile update acceptance
on:
  push:
    branches: [codex/qa32-daily]
    paths: ['.github/workflows/qa32-daily.yml', 'scripts/qa32/**', 'src-tauri/src/desktop_update_handoff.ps1']
permissions:
  contents: read
jobs:
  daily:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src-tauri/src
            scripts/qa32
          persist-credentials: false
      - name: Compile exact production profile parser and updater handoff in a focused test parent
        shell: pwsh
        run: |
          $dir=Join-Path $env:RUNNER_TEMP fixture
          cargo new $dir --bin --name zicode-studio-desktop
          if($LASTEXITCODE){exit $LASTEXITCODE}
          foreach($f in @('desktop_profile','desktop_profile.rs','process_command.rs','desktop_update_handoff.rs','desktop_update_handoff.ps1')){Copy-Item -LiteralPath "src-tauri/src/$f" -Destination "$dir/src/" -Recurse}
          Copy-Item scripts/qa32/daily-main.rs "$dir/src/main.rs" -Force
          Add-Content "$dir/Cargo.toml" @'
          fs2 = "0.4.3"
          dirs = "6"
          serde = { version = "1", features = ["derive"] }
          serde_json = "1"
          base64 = "0.22"
          '@
          Push-Location $dir
          cargo build --quiet
          exit $LASTEXITCODE
      - name: Install actual Studio with disposable daily selection, store credential, update and reopen it
        shell: pwsh
        working-directory: scripts/qa32
        run: |
          $ErrorActionPreference='Stop'
          $env:Q32_PROFILE=Join-Path $env:RUNNER_TEMP 'Daily profile'
          $dir=Join-Path $env:RUNNER_TEMP 'Daily installed Studio'
          $env:Q32_EXE=Join-Path $dir 'zicode-studio-desktop.exe'
          $updates=Join-Path $env:Q32_PROFILE 'data/desktop-updates'
          $creds=Join-Path $env:Q32_PROFILE 'system/credentials'
          [void][IO.Directory]::CreateDirectory($updates)
          [void][IO.Directory]::CreateDirectory($creds)
          [IO.File]::WriteAllText("$env:Q32_PROFILE/profile.json",'{"schemaVersion":1,"kind":"zicode-isolated-desktop"}'+[char]10)
          [IO.File]::WriteAllText("$creds/profile-permission.json",'{"schemaVersion":1,"systemCredentials":true}')
          $cfg=Join-Path $env:LOCALAPPDATA zicode
          [void][IO.Directory]::CreateDirectory($cfg)
          $config=Join-Path $cfg desktop-profile.json
          if(Test-Path $config){throw 'Expected a clean Windows account'}
          [IO.File]::WriteAllText($config,(@{schemaVersion=1;profileRoot=$env:Q32_PROFILE}|ConvertTo-Json -Compress))
          $before=(Get-FileHash $config).Hash
          $env:Q32_CANDIDATE=Join-Path $updates ("candidate-"+[guid]::NewGuid()+".exe")
          curl.exe -fsSL --max-time 240 -o $env:Q32_CANDIDATE https://github.com/ax2/zicode-studio-desktop/releases/download/v0.6.2/ZiCode.Studio.Desktop_0.6.2_x64-setup.exe
          if($LASTEXITCODE -or (Get-FileHash $env:Q32_CANDIDATE).Hash.ToLowerInvariant() -cne 'e6f18ac3d4de6dfab123755ff75cb3ca7cd6486ed4a11619c5269d8760abdb9c'){throw 'Unexpected public Windows installer'}
          $p=Start-Process $env:Q32_CANDIDATE -ArgumentList "/S /NS /D=$dir" -WindowStyle Hidden -PassThru
          if(!$p.WaitForExit(180000) -or $p.ExitCode){throw 'Initial real install failed'}
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--remote-debugging-port=0 --remote-debugging-address=127.0.0.1'
          $js=Join-Path $env:RUNNER_TEMP driver
          [void][IO.Directory]::CreateDirectory($js)
          Copy-Item daily-vault.mjs "$js/daily-vault.mjs"
          Set-Location $js
          npm install --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.56.1
          if($LASTEXITCODE){exit $LASTEXITCODE}
          node daily-vault.mjs seed
          if($LASTEXITCODE){exit $LASTEXITCODE}
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/fixture/target/debug/zicode-studio-desktop.exe" -Destination $env:Q32_EXE -Force
          & $env:Q32_EXE --tools-only
          if($LASTEXITCODE){exit $LASTEXITCODE}
          $deadline=[DateTime]::UtcNow.AddSeconds(180)
          $receipt=Join-Path $updates result.json
          do{
            $processes=@(Get-CimInstance Win32_Process -Filter "Name='zicode-studio-desktop.exe'")
            $apps=@($processes|Where-Object {$_.ExecutablePath -eq $env:Q32_EXE})
            $result=if(Test-Path $receipt){Get-Content -Raw $receipt|ConvertFrom-Json}
            if(!$apps -and $result.status -ne 'failed'){Start-Sleep -Milliseconds 300}
          }while(!$apps -and $result.status -ne 'failed' -and [DateTime]::UtcNow -lt $deadline)
          $report=@{receipt=$result;productVersion=(Get-Item $env:Q32_EXE).VersionInfo.ProductVersion;allCount=$processes.Count;installPathCount=$apps.Count;isolatedFlags=@($apps|Where-Object {$_.CommandLine -match 'isolated-profile|test-profile'}).Count;toolsFlags=@($apps|Where-Object {$_.CommandLine -match '--tools-only'}).Count;selectionUnchanged=((Get-FileHash $config).Hash -eq $before);candidateRemains=(Test-Path $env:Q32_CANDIDATE)}
          Write-Output ($report|ConvertTo-Json -Depth 4 -Compress)
          if($result.status -ne 'installed'){throw 'Missing successful install receipt'}
          if($apps.Count -ne 1){throw 'Expected exactly one relaunched instance from installed executable'}
          if($report.isolatedFlags -or $report.toolsFlags -ne 1 -or !$report.selectionUnchanged){throw 'Incorrect restart mode or daily profile selection'}
          node daily-vault.mjs verify
          exit $LASTEXITCODE
