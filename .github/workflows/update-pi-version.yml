name: Check pi updates

on:
  schedule:
    - cron: "0 9 * * *" # 每天 UTC 09:00 检查（北京时间 17:00）
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write
  pull-requests: write

jobs:
  check-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Verify update repository
        run: node scripts/check-release-repository.mjs --ci

      - name: Get latest pi release
        id: latest
        run: |
          RESPONSE=$(curl -sSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/earendil-works/pi/releases/latest)

          LATEST=$(echo "$RESPONSE" | jq -r '.tag_name // empty' | sed 's/^v//')

          # This value is interpolated into later shell steps by Actions.
          # Accept only stable numeric release tags before publishing it.
          if [[ ! "$LATEST" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Latest pi release tag is missing or not a stable numeric version."
            exit 1
          fi

          echo "version=$LATEST" >> $GITHUB_OUTPUT
          echo "Fetched latest pi version: $LATEST"

      - name: Get current pinned version
        id: current
        run: |
          CURRENT=$(jq -r '.version' scripts/pi-version.json)
          if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Pinned pi version is not a stable numeric version."
            exit 1
          fi
          echo "version=$CURRENT" >> $GITHUB_OUTPUT
          echo "Current pinned pi version: $CURRENT"

      - name: Check if already up to date
        id: compare
        run: |
          LATEST="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"

          if [ "$LATEST" = "$CURRENT" ]; then
            echo "Already up to date at v$CURRENT, nothing to do."
            echo "needs_update=false" >> $GITHUB_OUTPUT
          else
            echo "Update available: v$CURRENT -> v$LATEST"
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Check if PR already exists
        id: existing_pr
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          BRANCH="chore/bump-pi-${NEW}"

          EXISTING=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$BRANCH" \
            --state open \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already exists for v$NEW, skipping."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        uses: oven-sh/setup-bun@v2

      - name: Update and verify the complete Pi lock
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          bun run update:pi:lock -- "$NEW"
          bun add -d -E "@earendil-works/pi-coding-agent@$NEW" "@earendil-works/pi-tui@$NEW"
          bun run check:pi-sdk-alignment
          bun run typecheck:extensions-source
          bun run build:extensions
          bun run fetch:pi
          bun run smoke:pi-rpc:update
          bun run smoke:pi-rpc
          cat scripts/pi-version.json

      - name: Get pi release notes
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        run: |
          NEW="${{ steps.latest.outputs.version }}"

          curl --fail-with-body --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/earendil-works/pi/releases/tags/v${NEW}" \
            | jq -r '.body // "No release notes available."' > "$RUNNER_TEMP/pi-release-notes.md"

          # Keep untrusted release text out of Actions output delimiters and step env vars.

      - name: Create PR
        if: |
          steps.compare.outputs.needs_update == 'true' &&
          steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          CURRENT="${{ steps.current.outputs.version }}"
          BRANCH="chore/bump-pi-${NEW}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add scripts/pi-version.json package.json bun.lock tests/fixtures/pi-rpc
          git commit -m "chore: bump embedded pi to v${NEW}"
          # Reuse only an orphaned branch from this workflow. A lease prevents
          # overwriting a concurrent update after the remote tip was read.
          REMOTE_TIP="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$REMOTE_TIP" ]; then
            git fetch --no-tags origin "refs/heads/$BRANCH"
            REMOTE_AUTHOR="$(git show -s --format=%an FETCH_HEAD)"
            REMOTE_SUBJECT="$(git show -s --format=%s FETCH_HEAD)"
            if [ "$REMOTE_AUTHOR" != "github-actions[bot]" ] || [ "$REMOTE_SUBJECT" != "chore: bump embedded pi to v${NEW}" ]; then
              echo "::error::Existing update branch has non-workflow changes; review it manually."
              exit 1
            fi
            git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_TIP" origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          cat > "$RUNNER_TEMP/pi-pr-body.md" <<PREOF
          ## Embedded pi update

          pi released [v${NEW}](https://github.com/earendil-works/pi/releases/tag/v${NEW}).

          | | Version |
          |---|---|
          | Current | \`${CURRENT}\` |
          | New | \`${NEW}\` |

          ## Release notes
          PREOF
          cat "$RUNNER_TEMP/pi-release-notes.md" >> "$RUNNER_TEMP/pi-pr-body.md"
          cat >> "$RUNNER_TEMP/pi-pr-body.md" <<PREOF

          ## Checklist before merging
          - [x] The lock contains GitHub-published SHA-256 digests for every desktop target
          - [x] Extension SDK dependencies and lockfile match the embedded Pi version
          - [ ] Run \`bun run update:pi -- ${NEW}\` locally and confirm the RPC smoke test passes
          - [ ] Smoke test: \`bun run dev\` opens ZiCode Studio Desktop and sessions work
          - [ ] If breaking changes in release notes, update embedded-server or frontend accordingly

          ---
          *This PR was opened automatically by the [check pi updates](${SERVER_URL}/${REPOSITORY}/actions/runs/${RUN_ID}) workflow.*
          PREOF

          if gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --title "chore: bump embedded pi v${CURRENT} → v${NEW}" \
            --body-file "$RUNNER_TEMP/pi-pr-body.md"; then
            exit 0
          fi

          # A repository setting can reject PR creation even when this job has
          # contents/pull-requests write. Restore only the exact ref we pushed.
          if ! ACTIVE=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
            --state open --json number --jq '.[0].number // empty'); then
            echo "::warning::Could not check whether a PR was created; leaving the branch untouched."
            exit 1
          fi
          if [ -n "$ACTIVE" ]; then
            echo "PR #$ACTIVE now exists for v$NEW."
            exit 0
          fi
          PUSHED_TIP=$(git rev-parse HEAD)
          if [ -n "$REMOTE_TIP" ]; then
            git push --force-with-lease="refs/heads/$BRANCH:$PUSHED_TIP" \
              origin "$REMOTE_TIP:refs/heads/$BRANCH" \
              || echo "::warning::Could not restore the previous update branch tip."
          else
            git push --force-with-lease="refs/heads/$BRANCH:$PUSHED_TIP" \
              origin ":refs/heads/$BRANCH" \
              || echo "::warning::Could not remove this run's new update branch."
          fi
          echo "::error::Could not create the pi update PR. Check the repository Actions setting for creating pull requests."
          exit 1
