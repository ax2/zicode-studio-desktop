name: Verify existing release DMGs

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft tag (does not build or publish)
        required: true
        type: string
      target:
        description: Verify one existing DMG without rebuilding other platforms
        required: true
        default: darwin-arm64
        type: choice
        options:
          - darwin-arm64
          - darwin-x64

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ inputs.target == 'darwin-arm64' && 'macos-15' || 'macos-15-intel' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve fixed verification tools
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/dmg-verifier"
          cp scripts/verify-draft-macos.mjs scripts/verify-macos-dmg.mjs scripts/executable-architecture.mjs "$RUNNER_TEMP/dmg-verifier/"
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Verify final downloaded DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
          PI_TARGET_PLATFORM: ${{ inputs.target }}
        run: |
          set -euo pipefail
          export RELEASE_SOURCE_SHA="$(git rev-parse HEAD)"
          bun "$RUNNER_TEMP/dmg-verifier/verify-draft-macos.mjs"
      - uses: actions/upload-artifact@v7
        with:
          name: dmg-verification-${{ inputs.target }}
          path: dmg-verification/receipt.json
          if-no-files-found: error
