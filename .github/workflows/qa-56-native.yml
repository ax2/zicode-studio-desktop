name: Isolated Windows clipboard translation
on:
  push:
    branches: [codex/qa-56-native]
    paths: ['.github/workflows/qa-56-native.yml', 'scripts/qa/clipboard-56/**']
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/qa/clipboard-56
          persist-credentials: false
      - name: Install frozen Windows candidate in disposable VM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.6.2 -p '*x64-setup.exe' -D $env:RUNNER_TEMP
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $pkg=Get-Item "$env:RUNNER_TEMP/ZiCode.Studio.Desktop_0.6.2_x64-setup.exe"
          if ((Get-FileHash $pkg).Hash -ne 'E6F18AC3D4DE6DFAB123755FF75CB3CA7CD6486ED4A11619C5269D8760ABDB9C') {throw 'Candidate digest mismatch'}
          $dir=Join-Path $env:RUNNER_TEMP studio56
          $p=Start-Process $pkg -ArgumentList "/S /D=$dir" -PassThru -Wait
          if ($p.ExitCode) {throw "Installer: $($p.ExitCode)"}
          $exe=Get-Item "$dir/zicode-studio-desktop.exe"
          "STUDIO_56_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Exercise missing models, registration conflicts, manual imports and invalid clipboard input
        working-directory: scripts/qa/clipboard-56
        run: |
          npm install --no-audit --no-fund --ignore-scripts --no-save playwright-core@1.56.1
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          node edges.mjs
