name: Windows lightweight checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-light-checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the manual Windows check's cache namespace.
  platform:
    name: Windows lightweight checks
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Enable Windows long paths
        shell: pwsh
        run: git config --global core.longpaths true

      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Select applicable checks
        id: plan
        shell: pwsh
        run: node scripts/windows-light-checks.mjs plan (Join-Path $env:RUNNER_TEMP 'zicode-windows-light-checks.json')

      - uses: oven-sh/setup-bun@v2
        if: steps.plan.outputs.bun_checks == 'true'
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies once
        if: steps.plan.outputs.dependencies == 'true'
        run: bun install --frozen-lockfile

      - name: Run selected source checks and tests
        shell: pwsh
        run: node scripts/windows-light-checks.mjs check (Join-Path $env:RUNNER_TEMP 'zicode-windows-light-checks.json')

      - uses: dtolnay/rust-toolchain@stable
        if: steps.plan.outputs.rust == 'true'

      - name: Prepare Rust workspace
        if: steps.plan.outputs.rust == 'true'
        shell: pwsh
        run: |
          # The repository-local development mirror is not used by hosted Windows.
          git sparse-checkout set --no-cone '/*' '!/.cargo/config.toml'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/target" >> $env:GITHUB_ENV

      - uses: Swatinem/rust-cache@v2
        if: steps.plan.outputs.rust == 'true'
        with:
          workspaces: "src-tauri -> ../target"
          key: developer-platform-windows-2022
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          cache-on-failure: false

      - name: Check Rust on Windows
        if: steps.plan.outputs.rust == 'true'
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --all-targets
