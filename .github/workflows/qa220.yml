name: Windows confirmed quit update acceptance
on:
  push:
    branches: [qa/220-windows-confirmed-quit]
permissions:
  contents: read
jobs:
  verified-install:
    runs-on: windows-2022
    timeout-minutes: 100
    steps:
      - run: git config --global core.longpaths true
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Use the same official Cargo registry as Windows CI
        shell: pwsh
        run: |
          git sparse-checkout set --no-cone '/*' '!/.cargo/config.toml'
          "CARGO_TARGET_DIR=$env:GITHUB_WORKSPACE/target" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> ../target"
          shared-key: developer-platform-windows-2022-platform
          save-if: false
      - name: Prepare isolated older-version product and real installed registration
        shell: pwsh
        run: ./scripts/qa220/prepare.ps1
      - name: Build exact production UI and the instrumented tray menu trigger
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build:extensions
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run build:react
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun run bundle-css
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path src-tauri/Cargo.toml --bin zicode-studio-desktop
      - name: Check real update, cancel quit, then confirm installation and remain closed
        shell: pwsh
        run: |
          Copy-Item target/debug/zicode-studio-desktop.exe $env:Q220_EXE -Force
          robocopy public (Join-Path (Split-Path $env:Q220_EXE) public) /E /NFL /NDL /NJH /NJS /NP | Out-Null
          if ($LASTEXITCODE -ge 8) { throw 'Could not stage the production UI' }
          Push-Location scripts/qa220
          bun add --no-save --ignore-scripts playwright-core@1.56.1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node verify.mjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ((Get-Item $env:Q220_EXE).VersionInfo.ProductVersion -ne '0.7.0') { throw 'PE version mismatch' }
          Write-Output 'PASS actual installed PE version is 0.7.0'
