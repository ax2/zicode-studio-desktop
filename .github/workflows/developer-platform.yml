name: Developer platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: developer-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win32
            architecture: x64
            rust_target: x86_64-pc-windows-msvc
          - os: macos-15
            platform: darwin
            architecture: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            platform: darwin
            architecture: x64
            rust_target: x86_64-apple-darwin
          - os: ubuntu-22.04
            platform: linux
            architecture: x64
            rust_target: x86_64-unknown-linux-gnu
    env:
      ZICODE_CI_EXPECTED_PLATFORM: ${{ matrix.platform }}
      ZICODE_CI_EXPECTED_ARCH: ${{ matrix.architecture }}
      ZICODE_CI_EXPECTED_RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: Swatinem/rust-cache@v2
        with:
          # .cargo/config.toml places Cargo output at the repository root.
          workspaces: "src-tauri -> ../target"
          key: developer-platform-${{ matrix.os }}
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Check developer platform
        run: node scripts/developer-platform-checks.mjs --out "${{ runner.temp }}/zicode-platform-checks"
      - name: Preserve check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: developer-platform-${{ matrix.os }}
          path: ${{ runner.temp }}/zicode-platform-checks/
          if-no-files-found: warn
          retention-days: 14
