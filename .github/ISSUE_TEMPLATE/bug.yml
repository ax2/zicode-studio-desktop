name: 问题反馈
description: 记录实际问题、复现方法和预期行为
title: "[问题] "
labels: ["type:bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题与预期行为
      description: 描述实际发生的情况，以及希望程序怎样工作。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 写明使用的功能、操作顺序；不要附凭据或私人内容。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 版本与环境
      placeholder: Windows版本、Studio版本、窗口大小或缩放
  - type: textarea
    id: evidence
    attributes:
      label: 日志或截图
      description: 先去除隐私信息；可以留空。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 什么行为能证明问题已解决？
